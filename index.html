<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = { id: 'utente1' };

    // Carica foto da localStorage o array vuoto
    let photos = JSON.parse(localStorage.getItem('plp_' + user.id)) || [];

    function savePhotos() {
        try {
            localStorage.setItem('plp_' + user.id, JSON.stringify(photos));
        } catch (e) {
            if (e.name === 'QuotaExceededError') alert('Spazio esaurito!');
            else console.error(e);
        }
    }

    function renderPhotos() {
        const container = document.getElementById('photoContainer');
        if (!container) return console.error('photoContainer non trovato!');
        container.innerHTML = '';
        photos.forEach(photo => {
            const img = document.createElement('img');
            img.src = photo.url;
            img.alt = photo.name || 'Foto';
            container.appendChild(img);
        });
    }

    function initUI() {
        console.log('InitUI avviata');

        renderPhotos();

        const addBtn = document.getElementById('addPhotoButton');
        const removeBtn = document.getElementById('removePhotoButton');

        if (addBtn) addBtn.addEventListener('click', () => {
            photos.push({ url: 'https://via.placeholder.com/100', name: 'Nuova Foto' });
            renderPhotos();
            savePhotos();
        });

        if (removeBtn) removeBtn.addEventListener('click', () => {
            photos.pop();
            renderPhotos();
            savePhotos();
        });

        const loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';

        console.log('InitUI completata');
    }

    initUI();
});
</script>
